name: Refresh risk signal

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC (6:17 a.m. Pacific)
  workflow_dispatch: {}      # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python scripts/refresh_signal.py
      - name: Commit updated signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external_signal.json data/signal_history.csv
          git diff --cached --quiet || (git commit -m "Daily risk signal refresh" && git push)
