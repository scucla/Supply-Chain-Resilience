name: Fetch public-domain media (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fetch_media.py
      - name: Commit raw media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media_raw
          git diff --cached --quiet || (git commit -m "Fetch public-domain media from Wikimedia Commons" && git pull --rebase && git push)
